# Push a tag like v0.1.1 to build the Windows installer and publish it as a GitHub release.
# The installed app checks these releases for updates (electron-updater reads latest.yml).
#
# The release is created as a draft first, electron-builder uploads into it, and only then is it
# published and marked latest. Without that first step, parallel uploads can each create their own
# release for the same tag (that happened to v0.1.0).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Create the draft release
        shell: bash
        run: gh release create "$TAG" --draft --verify-tag --title "Loadout ${TAG#v}" --notes-file docs/release-notes.md
      - name: Build and upload the installer
        run: npm run release
      - name: Publish the release as latest
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest
